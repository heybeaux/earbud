<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../mockups.css"><script src="../kit.js"></script>
<style>
  .facts { width: 100%; max-width: 440px; margin-top: 22px; text-align: left; }
  .facts .row { min-height: 40px; }
  .facts .ok { width: 18px; height: 18px; color: var(--green); }
  .batt { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .battery { width: 26px; height: 13px; border-radius: 3.5px; box-shadow: inset 0 0 0 1.2px rgba(0,0,0,.4); padding: 2px; position: relative; }
  .battery::after { content: ""; position: absolute; right: -3px; top: 4px; width: 2px; height: 5px; border-radius: 0 1px 1px 0; background: rgba(0,0,0,.4); }
  .battery i { display: block; height: 100%; border-radius: 1.5px; background: var(--green); }
</style></head>
<body><div class="desk">
  <div class="win setup">
    <div class="tl setup"></div><div class="titlebar"></div>
    <div class="body">
      <div class="art" style="height:170px"><div class="fieldy-art" data-w="230" data-led="#3BD36B" data-badge="check"></div></div>
      <h1>Connected</h1>
      <p class="lead">Your Fieldy is paired with this Mac. No code needed.</p>
      <div class="facts group">
        <div class="row"><i class="ic ok" data-i="checkc"></i><div class="lbl">Paired with this Mac</div><span class="val">Fieldy 3A7C</span></div>
        <div class="row"><i class="ic ok" data-i="checkc"></i><div class="lbl">Clock set</div><span class="val">Fri 30 Oct, 1:41 PM</span></div>
        <div class="row"><i class="ic ok" data-i="checkc"></i><div class="lbl">Battery</div><span class="batt"><span class="battery"><i style="width:82%"></i></span>82%</span></div>
      </div>
    </div>
    <div class="foot">
      <div class="steps"><i class="done"></i><i class="done"></i><i class="done"></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
      <span class="sp"></span>
      <span class="btn lg primary">Continue</span>
    </div>
  </div>
</div></body></html>
